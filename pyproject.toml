[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-hvn"
version = "0.1.0"
description = "Deterministic historical profile and HVN construction for NQ one-minute OHLCV"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["zstandard>=0.22"]

[project.scripts]
hvn-stage1 = "hvn.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/ is on sys.path so fixtures can be shared between test modules.
pythonpath = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
